[package]
name = "bcur-bench"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Criterion benches for bcur (not published)"

[dependencies]
bcur = { path = "../bcur" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "bytewords"
harness = false
path = "benches/bytewords.rs"

[[bench]]
name = "fountain"
harness = false
path = "benches/fountain.rs"

[[bench]]
name = "ur_roundtrip"
harness = false
path = "benches/ur_roundtrip.rs"

[lints]
workspace = true
