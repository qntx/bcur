[package]
name = "bcur-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line Uniform Resource encoder with terminal QR output"
keywords = ["ur", "bytewords", "qr", "cli"]
categories = ["command-line-utilities", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/bcur-cli"
publish = true

[[bin]]
name = "bcur"
path = "src/main.rs"

[dependencies]
bcur = { path = "../bcur", version = "0.2" }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
hex = "0.4"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
